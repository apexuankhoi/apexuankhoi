<svg width="1200" height="150" viewBox="0 0 1200 150" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Thanks for stopping by</title>
  <desc id="desc">A midnight neon footer with a thank-you message.</desc>
  <defs>
    <linearGradient id="bg" x1="40" y1="15" x2="1160" y2="140" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090D1A"/>
      <stop offset="0.55" stop-color="#11152B"/>
      <stop offset="1" stop-color="#090D1A"/>
    </linearGradient>
    <linearGradient id="accent" x1="144" y1="0" x2="1056" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#8B5CF6"/>
      <stop offset="0.75" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 140) scale(390 120)">
      <stop stop-color="#7C3AED" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="1196" height="146" rx="22" fill="url(#bg)"/>
  <rect x="2" y="2" width="1196" height="146" rx="22" fill="url(#glow)"/>
  <path d="M130 38H1070" stroke="url(#accent)" stroke-width="2"/>
  <circle cx="600" cy="38" r="4" fill="#22D3EE"/>
  <text x="600" y="84" text-anchor="middle" fill="#F8FAFC" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="0.8">Thanks for stopping by.</text>
  <text x="600" y="113" text-anchor="middle" fill="#94A3B8" font-family="'Segoe UI', Arial, sans-serif" font-size="14" letter-spacing="2.2">BUILD WITH CARE  ·  SHIP WITH CONFIDENCE</text>
  <rect x="2" y="2" width="1196" height="146" rx="22" stroke="#303858" stroke-width="2"/>
</svg>
