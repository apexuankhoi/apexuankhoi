<svg width="1200" height="460" viewBox="0 0 1200 460" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Nguyễn Xuân Khởi — Frontend, web and mobile developer</title>
  <desc id="desc">A midnight neon developer banner featuring Nguyễn Xuân Khởi's name and a code window.</desc>

  <defs>
    <linearGradient id="background" x1="70" y1="10" x2="1130" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090D1A"/>
      <stop offset="0.52" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#11152B"/>
    </linearGradient>
    <linearGradient id="accent" x1="140" y1="106" x2="667" y2="344" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA"/>
      <stop offset="0.48" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="line" x1="90" y1="0" x2="1110" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="0.24" stop-color="#8B5CF6"/>
      <stop offset="0.75" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="purpleGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1050 75) rotate(135) scale(330 290)">
      <stop stop-color="#7C3AED" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(188 420) rotate(-35) scale(310 220)">
      <stop stop-color="#22D3EE" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#C4B5FD" stroke-opacity="0.055"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <clipPath id="frame">
      <rect x="2" y="2" width="1196" height="456" rx="26"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="2" y="2" width="1196" height="456" rx="26" fill="url(#background)"/>
    <rect x="2" y="2" width="1196" height="456" rx="26" fill="url(#grid)"/>
    <rect x="2" y="2" width="1196" height="456" rx="26" fill="url(#purpleGlow)"/>
    <rect x="2" y="2" width="1196" height="456" rx="26" fill="url(#cyanGlow)"/>

    <circle cx="1118" cy="366" r="92" stroke="#22D3EE" stroke-opacity="0.11" stroke-width="24"/>
    <circle cx="1090" cy="389" r="146" stroke="#8B5CF6" stroke-opacity="0.08"/>
    <circle cx="74" cy="42" r="94" fill="#8B5CF6" fill-opacity="0.05"/>

    <g transform="translate(82 70)">
      <rect width="190" height="34" rx="17" fill="#151A30" stroke="#2A3154"/>
      <circle cx="18" cy="17" r="5" fill="#22D3EE"/>
      <text x="32" y="22" fill="#A5B4FC" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.6">HANOI · VIETNAM</text>
    </g>

    <text x="80" y="163" fill="#F8FAFC" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="500" letter-spacing="2">HELLO, I'M</text>
    <text x="76" y="228" fill="url(#accent)" font-family="'Segoe UI', Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="-2">NGUYỄN XUÂN</text>
    <text x="76" y="294" fill="#F8FAFC" font-family="'Segoe UI', Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="-2">KHỞI</text>

    <rect x="80" y="326" width="445" height="2" rx="1" fill="url(#line)"/>
    <text x="80" y="363" fill="#C4B5FD" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="3">FRONTEND  ·  WEB  ·  MOBILE</text>
    <text x="80" y="397" fill="#94A3B8" font-family="'Segoe UI', Arial, sans-serif" font-size="16">Building clear interfaces and useful digital products.</text>

    <g filter="url(#shadow)">
      <rect x="665" y="68" width="455" height="322" rx="20" fill="#0A0E1B" stroke="#303858"/>
      <rect x="665.5" y="68.5" width="454" height="51" rx="19.5" fill="#12172A"/>
      <path d="M665 119.5H1120" stroke="#303858"/>

      <circle cx="695" cy="94" r="6" fill="#FB7185"/>
      <circle cx="717" cy="94" r="6" fill="#FBBF24"/>
      <circle cx="739" cy="94" r="6" fill="#34D399"/>
      <rect x="796" y="84" width="191" height="22" rx="7" fill="#0B1020"/>
      <text x="849" y="100" fill="#64748B" font-family="Consolas, 'Courier New', monospace" font-size="12">developer.js</text>

      <g font-family="Consolas, 'Courier New', monospace" font-size="16">
        <g fill="#475569" font-size="13">
          <text x="687" y="151">01</text>
          <text x="687" y="183">02</text>
          <text x="687" y="215">03</text>
          <text x="687" y="247">04</text>
          <text x="687" y="279">05</text>
          <text x="687" y="311">06</text>
          <text x="687" y="343">07</text>
        </g>
        <text x="725" y="151" fill="#C4B5FD">const</text>
        <text x="775" y="151" fill="#67E8F9">developer</text>
        <text x="865" y="151" fill="#94A3B8">= {</text>

        <text x="745" y="183" fill="#A5B4FC">name:</text>
        <text x="805" y="183" fill="#86EFAC">"Khởi"</text>
        <text x="861" y="183" fill="#94A3B8">,</text>

        <text x="745" y="215" fill="#A5B4FC">craft:</text>
        <text x="813" y="215" fill="#94A3B8">[</text>
        <text x="824" y="215" fill="#86EFAC">"web"</text>
        <text x="872" y="215" fill="#94A3B8">,</text>
        <text x="889" y="215" fill="#86EFAC">"mobile"</text>
        <text x="965" y="215" fill="#94A3B8">],</text>

        <text x="745" y="247" fill="#A5B4FC">caresAbout:</text>
        <text x="856" y="247" fill="#86EFAC">"users"</text>
        <text x="923" y="247" fill="#94A3B8">,</text>

        <text x="745" y="279" fill="#A5B4FC">curious:</text>
        <text x="824" y="279" fill="#FBBF24">true</text>
        <text x="858" y="279" fill="#94A3B8">,</text>

        <text x="745" y="311" fill="#A5B4FC">mindset:</text>
        <text x="824" y="311" fill="#86EFAC">"keep shipping"</text>

        <text x="725" y="343" fill="#94A3B8">};</text>
        <rect x="749" y="353" width="8" height="3" rx="1.5" fill="#22D3EE">
          <animate attributeName="opacity" values="1;0.15;1" dur="1.4s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <circle cx="1108" cy="70" r="3" fill="#22D3EE" opacity="0.8">
      <animate attributeName="opacity" values="0.25;1;0.25" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="636" cy="390" r="3" fill="#A78BFA" opacity="0.8">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect x="2" y="2" width="1196" height="456" rx="26" stroke="url(#accent)" stroke-opacity="0.42" stroke-width="3"/>
</svg>
